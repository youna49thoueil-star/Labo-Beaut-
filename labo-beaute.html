<title>Labo Beauté</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: an atelier bench — client order + live product on the left, mixing station on the right, finished products on a shelf below */
:root {
  --bg: #f3eff4;
  --panel: #ffffff;
  --ink: #2a1730;
  --muted: #76657a;
  --line: #e2d8e5;
  --accent: #c2185b;
  --accent-ink: #ffffff;
  --good: #2e8b57;
  --warn: #c77700;
  --shelf: #d9c9d6;
  --display: "Syne", "Avenir Next", system-ui, sans-serif;
  --body: "Manrope", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1220; --panel: #261a2c; --ink: #f4e9f5; --muted: #b5a2b8; --line: #3d2c44;
    --accent: #ff4f9a; --accent-ink: #1b1220; --good: #5fd39a; --warn: #ffb347; --shelf: #3a2a40;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1220; --panel: #261a2c; --ink: #f4e9f5; --muted: #b5a2b8; --line: #3d2c44;
  --accent: #ff4f9a; --accent-ink: #1b1220; --good: #5fd39a; --warn: #ffb347; --shelf: #3a2a40;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 48px; display: grid; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(30px, 6vw, 48px); line-height: 1; margin: 0; letter-spacing: -0.02em; }
h1 span { color: var(--accent); }
.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chip small { color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 11px; margin-right: 6px; }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; }
@media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 700; }
h2 { font-family: var(--display); font-size: 20px; margin: 0; font-weight: 800; text-wrap: balance; }
.order { display: grid; gap: 10px; }
.order p { margin: 0; }
.req { display: flex; flex-wrap: wrap; gap: 8px; }
.req span { border: 1px dashed var(--line); border-radius: 10px; padding: 4px 10px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 16px; height: 16px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,.15); }
.stage { position: relative; display: grid; place-items: center; background: radial-gradient(circle at 50% 40%, var(--bg), var(--panel)); border-radius: 14px; border: 1px solid var(--line); }
canvas#view { width: 100%; max-width: 320px; aspect-ratio: 1; height: auto; }
.compare { display: flex; gap: 12px; align-items: center; justify-content: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.compare .big { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 12px; font-weight: 600; transition: transform .08s, border-color .15s; }
button:hover { border-color: var(--accent); }
button:active { transform: scale(.96); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.pig { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.pig button { display: grid; justify-items: center; gap: 4px; padding: 10px 6px; }
.drop { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 1px solid rgba(0,0,0,.15); }
.pig b { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--muted); }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; padding: 12px 18px; font-size: 16px; }
.primary:hover { filter: brightness(1.08); border-color: var(--accent); }
input[type=text] { font: inherit; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.result { border-radius: 14px; padding: 14px; background: var(--bg); border: 1px solid var(--line); display: grid; gap: 6px; }
.result .score { font-family: var(--display); font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.lines { font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.item { display: grid; justify-items: center; gap: 2px; text-align: center; font-size: 12px; padding-bottom: 8px; border-bottom: 6px solid var(--shelf); }
.item canvas { width: 90px; height: 90px; }
.item strong { font-size: 13px; overflow-wrap: anywhere; }
.item span { color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <div class="label">Atelier de cosmétiques</div>
      <h1>Labo <span>Beauté</span></h1>
    </div>
    <div class="stats">
      <div class="chip"><small>Commande</small><span id="round">1</span></div>
      <div class="chip"><small>Pièces</small><span id="coins">0</span> ✦</div>
      <div class="chip"><small>Meilleur score</small><span id="best">–</span></div>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="order-title">
      <div class="order">
        <div class="label">Commande client</div>
        <h2 id="order-title">…</h2>
        <p id="order-text"></p>
        <div class="req" id="order-req"></div>
      </div>
      <div class="stage"><canvas id="view" width="640" height="640" aria-label="Aperçu du produit"></canvas></div>
      <div class="compare">
        <div style="display:grid;justify-items:center;gap:4px"><div class="big" id="cmp-target"></div>Demandé</div>
        <div style="display:grid;justify-items:center;gap:4px"><div class="big" id="cmp-mix"></div>Ton mélange</div>
        <div id="cmp-hint" style="max-width:180px"></div>
      </div>
    </section>

    <section class="panel" aria-label="Station de mélange">
      <div>
        <div class="label">1 · Produit</div>
        <div class="row" id="products"></div>
      </div>
      <div style="display:grid;gap:8px">
        <div class="label">2 · Pigments (clique pour ajouter une goutte)</div>
        <div class="pig" id="pigments"></div>
        <div class="row">
          <button id="undo">↶ Annuler la goutte</button>
          <button id="clear">Vider le mélange</button>
        </div>
      </div>
      <div>
        <div class="label">3 · Fini</div>
        <div class="row" id="finishes"></div>
      </div>
      <div>
        <div class="label">4 · Parfum</div>
        <div class="row" id="scents"></div>
      </div>
      <div>
        <label class="label" for="name">5 · Nom du produit</label>
        <input type="text" id="name" maxlength="28" placeholder="ex. Velours de minuit">
      </div>
      <div class="row">
        <button class="primary" id="deliver">Livrer au client</button>
        <button id="skip">Autre client</button>
      </div>
      <div class="result" id="result" hidden></div>
    </section>
  </div>

  <section class="panel" aria-labelledby="shelf-title">
    <h2 id="shelf-title">Ma collection</h2>
    <div class="shelf" id="shelf"></div>
    <p class="empty" id="shelf-empty">Tes créations livrées apparaîtront ici.</p>
  </section>
</div>

<script>
const PIGMENTS = [
  { id: "rouge", name: "Rouge", hex: "#d01c1f" },
  { id: "magenta", name: "Magenta", hex: "#e0218a" },
  { id: "jaune", name: "Jaune", hex: "#f5c518" },
  { id: "bleu", name: "Bleu", hex: "#1d3fa8" },
  { id: "blanc", name: "Blanc", hex: "#ffffff" },
  { id: "noir", name: "Noir", hex: "#1a1a1a" },
  { id: "brun", name: "Terre", hex: "#7a4a2a" },
];
const PRODUCTS = [
  { id: "rouge", name: "Rouge à lèvres" },
  { id: "vernis", name: "Vernis à ongles" },
  { id: "ombre", name: "Fard à paupières" },
];
const FINISHES = [
  { id: "mat", name: "Mat" },
  { id: "satine", name: "Satiné" },
  { id: "brillant", name: "Brillant" },
  { id: "paillete", name: "Pailleté" },
];
const SCENTS = [
  { id: "aucun", name: "Sans parfum" },
  { id: "vanille", name: "Vanille" },
  { id: "rose", name: "Rose" },
  { id: "fraise", name: "Fraise" },
  { id: "menthe", name: "Menthe" },
];
const SHADES = [
  ["Rouge cerise", "#b3122e"], ["Nude rosé", "#c98b7e"], ["Prune", "#5e1f3d"],
  ["Corail", "#f2665a"], ["Fuchsia", "#d6246e"], ["Bordeaux", "#6d1028"],
  ["Pêche", "#f4a582"], ["Mauve", "#9b6b8e"], ["Bleu nuit", "#1f2a5a"],
  ["Vert sauge", "#8fa58a"], ["Lilas", "#b9a2d6"], ["Bronze", "#8a5a34"],
  ["Rose poudré", "#e8b4bc"], ["Chocolat", "#4a2a1e"], ["Orange sanguine", "#d9471f"],
];
const CLIENTS = ["Inès", "Chloé", "Malik", "Jade", "Sacha", "Lou", "Nora", "Hugo", "Amel", "Théo", "Yasmine", "Camille"];
const OCCASIONS = ["pour un mariage samedi", "pour un premier rendez-vous", "pour un concert", "pour le bureau", "pour une soirée d'été", "pour une séance photo", "pour le bal de fin d'année"];

const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];

// ---------- colour maths ----------
const hexToRgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);
const rgbToHex = (c) => "#" + c.map((v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, "0")).join("");
// Paint-like (subtractive) mix: weighted geometric mean of reflectance per channel
function mix(drops) {
  const total = Object.values(drops).reduce((a, b) => a + b, 0);
  if (!total) return null;
  const out = [0, 0, 0];
  for (const p of PIGMENTS) {
    const n = drops[p.id] || 0;
    if (!n) continue;
    hexToRgb(p.hex).forEach((v, i) => (out[i] += (n / total) * Math.log(Math.max(v, 0.03))));
  }
  return rgbToHex(out.map(Math.exp));
}
function toLab(hex) {
  const lin = hexToRgb(hex).map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  const [r, g, b] = lin;
  const xyz = [(r * 0.4124 + g * 0.3576 + b * 0.1805) / 0.95047, r * 0.2126 + g * 0.7152 + b * 0.0722, (r * 0.0193 + g * 0.1192 + b * 0.9505) / 1.08883];
  const f = xyz.map((t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116));
  return [116 * f[1] - 16, 500 * (f[0] - f[1]), 200 * (f[1] - f[2])];
}
function deltaE(a, b) {
  const A = toLab(a), B = toLab(b);
  return Math.hypot(A[0] - B[0], A[1] - B[1], A[2] - B[2]);
}
function hint(mixHex, target) {
  if (!mixHex) return "Ajoute des gouttes de pigment.";
  const A = toLab(mixHex), B = toLab(target);
  const d = deltaE(mixHex, target);
  if (d < 6) return "Presque parfait !";
  const tips = [];
  if (A[0] - B[0] > 6) tips.push("trop clair");
  if (B[0] - A[0] > 6) tips.push("trop foncé");
  if (A[1] - B[1] > 8) tips.push("trop rouge");
  if (B[1] - A[1] > 8) tips.push("pas assez rouge");
  if (A[2] - B[2] > 8) tips.push("trop jaune");
  if (B[2] - A[2] > 8) tips.push("trop bleu");
  return tips.length ? "Ton mélange est " + tips.join(", ") + "." : "Tu chauffes…";
}

// ---------- drawing ----------
function shade(hex, k) {
  return rgbToHex(hexToRgb(hex).map((v) => (k > 0 ? v + (1 - v) * k : v * (1 + k))));
}
function rng(seed) { let s = seed || 1; return () => ((s = (s * 16807) % 2147483647) / 2147483647); }

function drawProduct(cv, p) {
  const ctx = cv.getContext("2d");
  const W = cv.width, S = W / 320;
  ctx.clearRect(0, 0, W, W);
  ctx.save();
  ctx.scale(S, S);
  const col = p.color || "#d8cfd9";
  const empty = !p.color;
  if (p.product === "rouge") {
    // case
    let g = ctx.createLinearGradient(110, 0, 210, 0);
    g.addColorStop(0, "#7a5b22"); g.addColorStop(0.45, "#e6c56b"); g.addColorStop(1, "#6b4d1a");
    ctx.fillStyle = g; roundRect(ctx, 110, 180, 100, 110, 8); ctx.fill();
    ctx.fillStyle = "#2a1730"; roundRect(ctx, 104, 240, 112, 56, 8); ctx.fill();
    // bullet
    g = ctx.createLinearGradient(122, 0, 198, 0);
    g.addColorStop(0, shade(col, -0.35)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -0.45));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(122, 185); ctx.lineTo(122, 90); ctx.lineTo(198, 50); ctx.lineTo(198, 185); ctx.closePath(); ctx.fill();
    finishGloss(ctx, p, 135, 70, 22, 110);
    sparkle(ctx, p, (x, y) => y > 55 + (198 - x) * 0.5 && x > 124 && x < 196 && y < 183, [122, 50, 76, 135]);
  } else if (p.product === "vernis") {
    ctx.fillStyle = "#1c1420"; roundRect(ctx, 138, 40, 44, 96, 8); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.12)"; roundRect(ctx, 144, 46, 8, 84, 4); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.55)"; roundRect(ctx, 96, 130, 128, 150, 26); ctx.fill();
    const g = ctx.createLinearGradient(100, 0, 220, 0);
    g.addColorStop(0, shade(col, -0.3)); g.addColorStop(0.5, col); g.addColorStop(1, shade(col, -0.35));
    ctx.fillStyle = g; roundRect(ctx, 104, 150, 112, 122, 20); ctx.fill();
    finishGloss(ctx, p, 116, 158, 16, 100);
    sparkle(ctx, p, () => true, [106, 152, 108, 118]);
    ctx.fillStyle = "rgba(255,255,255,.35)"; roundRect(ctx, 112, 136, 10, 128, 5); ctx.fill();
    if (p.label) label(ctx, p.label, 160, 214, 100);
  } else {
    ctx.fillStyle = "#2a1730"; ctx.beginPath(); ctx.arc(160, 165, 118, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#e6c56b"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(160, 165, 110, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#9b8f9c"; ctx.beginPath(); ctx.arc(160, 165, 88, 0, Math.PI * 2); ctx.fill();
    const g = ctx.createRadialGradient(140, 140, 10, 160, 165, 86);
    g.addColorStop(0, shade(col, 0.12)); g.addColorStop(1, shade(col, -0.25));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(160, 165, 84, 0, Math.PI * 2); ctx.fill();
    if (p.finish !== "mat" && !empty) {
      ctx.fillStyle = `rgba(255,255,255,${p.finish === "brillant" ? 0.45 : 0.2})`;
      ctx.beginPath(); ctx.ellipse(130, 130, 34, 16, -0.6, 0, Math.PI * 2); ctx.fill();
    }
    sparkle(ctx, p, (x, y) => Math.hypot(x - 160, y - 165) < 82, [78, 83, 164, 164]);
  }
  ctx.restore();
}
function finishGloss(ctx, p, x, y, w, h) {
  if (!p.color || p.finish === "mat") return;
  const a = p.finish === "brillant" ? 0.6 : p.finish === "satine" ? 0.25 : 0.2;
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, `rgba(255,255,255,0)`); g.addColorStop(0.5, `rgba(255,255,255,${a})`); g.addColorStop(1, `rgba(255,255,255,0)`);
  ctx.fillStyle = g; roundRect(ctx, x, y, w, h, w / 2); ctx.fill();
}
function sparkle(ctx, p, inside, box) {
  if (!p.color || p.finish !== "paillete") return;
  const r = rng(p.seed || 7);
  for (let i = 0; i < 160; i++) {
    const x = box[0] + r() * box[2], y = box[1] + r() * box[3];
    if (!inside(x, y)) continue;
    ctx.fillStyle = r() > 0.5 ? "rgba(255,255,255,.85)" : "rgba(255,226,140,.8)";
    ctx.beginPath(); ctx.arc(x, y, 0.6 + r() * 1.6, 0, Math.PI * 2); ctx.fill();
  }
}
function label(ctx, text, x, y, maxW) {
  ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(ctx, x - maxW / 2, y - 14, maxW, 28, 6); ctx.fill();
  ctx.fillStyle = "#2a1730"; ctx.font = "700 12px Manrope, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  let t = text; while (ctx.measureText(t).width > maxW - 10 && t.length > 1) t = t.slice(0, -1);
  ctx.fillText(t === text ? t : t + "…", x, y + 1);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

// ---------- state ----------
let S = {
  round: 1, coins: 0, best: null, order: null,
  product: "rouge", finish: "satine", scent: "aucun", drops: {}, history: [], name: "",
  shelf: [], delivered: false,
};
function load() {
  try { const d = JSON.parse(localStorage.getItem("labo-beaute") || "null"); if (d) Object.assign(S, { coins: d.coins || 0, best: d.best ?? null, shelf: d.shelf || [], round: d.round || 1 }); } catch (e) {}
}
function save() {
  try { localStorage.setItem("labo-beaute", JSON.stringify({ coins: S.coins, best: S.best, shelf: S.shelf.slice(0, 40), round: S.round })); } catch (e) {}
}

function newOrder() {
  const [shadeName, hex] = pick(SHADES);
  const product = pick(PRODUCTS);
  S.order = {
    client: pick(CLIENTS), occasion: pick(OCCASIONS), shadeName, hex,
    product: product.id, finish: pick(FINISHES).id, scent: pick(SCENTS).id,
  };
  S.product = product.id; S.drops = {}; S.history = []; S.delivered = false; S.name = "";
  $("name").value = ""; $("result").hidden = true;
  render();
}

function buttons(el, list, key) {
  el.innerHTML = "";
  for (const it of list) {
    const b = document.createElement("button");
    b.textContent = it.name; b.setAttribute("aria-pressed", S[key] === it.id);
    b.onclick = () => { S[key] = it.id; render(); };
    el.appendChild(b);
  }
}
function nameOf(list, id) { return list.find((x) => x.id === id).name; }

function render() {
  const o = S.order;
  $("round").textContent = S.round; $("coins").textContent = S.coins; $("best").textContent = S.best == null ? "–" : S.best + "/100";
  $("order-title").textContent = `${o.client} veut un ${nameOf(PRODUCTS, o.product).toLowerCase()}`;
  $("order-text").textContent = `« J'aimerais un ${nameOf(PRODUCTS, o.product).toLowerCase()} ${o.shadeName.toLowerCase()} ${o.occasion}. »`;
  $("order-req").innerHTML =
    `<span><i class="sw" style="background:${o.hex}"></i>${o.shadeName}</span>` +
    `<span>Fini ${nameOf(FINISHES, o.finish).toLowerCase()}</span>` +
    `<span>${nameOf(SCENTS, o.scent)}</span>`;
  buttons($("products"), PRODUCTS, "product");
  buttons($("finishes"), FINISHES, "finish");
  buttons($("scents"), SCENTS, "scent");

  const pg = $("pigments"); pg.innerHTML = "";
  for (const p of PIGMENTS) {
    const b = document.createElement("button");
    b.setAttribute("aria-label", `Ajouter une goutte de ${p.name}`);
    b.innerHTML = `<i class="drop" style="background:${p.hex}"></i>${p.name}<b>${S.drops[p.id] || 0} goutte${(S.drops[p.id] || 0) > 1 ? "s" : ""}</b>`;
    b.onclick = () => { S.drops[p.id] = (S.drops[p.id] || 0) + 1; S.history.push(p.id); render(); };
    pg.appendChild(b);
  }
  const color = mix(S.drops);
  $("cmp-target").style.background = o.hex;
  $("cmp-mix").style.background = color || "transparent";
  $("cmp-hint").textContent = hint(color, o.hex);
  drawProduct($("view"), { product: S.product, color, finish: S.finish, seed: S.history.length + 3, label: S.name });
  $("deliver").disabled = S.delivered;
  $("deliver").style.opacity = S.delivered ? 0.5 : 1;
  renderShelf();
}

function renderShelf() {
  const sh = $("shelf");
  $("shelf-empty").hidden = S.shelf.length > 0;
  if (sh.childElementCount === S.shelf.length) return;
  sh.innerHTML = "";
  for (const it of S.shelf) {
    const d = document.createElement("div"); d.className = "item";
    const c = document.createElement("canvas"); c.width = 180; c.height = 180;
    drawProduct(c, it);
    d.append(c);
    d.insertAdjacentHTML("beforeend", `<strong></strong><span>${nameOf(PRODUCTS, it.product)} · ${it.score}/100</span>`);
    d.querySelector("strong").textContent = it.name;
    sh.appendChild(d);
  }
}

function deliver() {
  const o = S.order, color = mix(S.drops), res = $("result");
  res.hidden = false;
  if (!color) { res.innerHTML = `<strong>Le mélange est vide.</strong><span class="lines">Ajoute au moins une goutte de pigment avant de livrer.</span>`; return; }
  const d = deltaE(color, o.hex);
  const colorPts = Math.round(Math.max(0, 60 - d * 1.2));
  const productPts = S.product === o.product ? 15 : 0;
  const finishPts = S.finish === o.finish ? 15 : 0;
  const scentPts = S.scent === o.scent ? 10 : 0;
  const score = colorPts + productPts + finishPts + scentPts;
  const coins = Math.round(score / 5) + (score >= 90 ? 10 : 0);
  const mood = score >= 90 ? `${o.client} est ravi·e : « C'est exactement ça ! »` : score >= 70 ? `${o.client} est content·e.` : score >= 45 ? `${o.client} hésite un peu…` : `${o.client} repart déçu·e.`;
  S.coins += coins; S.best = Math.max(S.best ?? 0, score); S.delivered = true; S.round++;
  const name = ($("name").value.trim() || `${o.shadeName} n°${S.round - 1}`);
  S.shelf.unshift({ product: S.product, color, finish: S.finish, seed: S.history.length + 3, label: name, name, score });
  save();
  res.innerHTML = `
    <div class="label">Résultat</div>
    <div class="score">${score}<small style="font-size:16px;color:var(--muted)">/100</small></div>
    <div class="bar"><i style="width:${score}%"></i></div>
    <strong>${mood}</strong>
    <div class="lines">
      <span>Couleur : ${colorPts}/60 (écart ${d.toFixed(1)})</span>
      <span>Produit : ${productPts}/15 · Fini : ${finishPts}/15 · Parfum : ${scentPts}/10</span>
      <span>+${coins} pièces ✦</span>
    </div>
    <div class="row"><button class="primary" id="next">Client suivant</button></div>`;
  $("next").onclick = newOrder;
  render();
}

$("undo").onclick = () => { const id = S.history.pop(); if (id) { S.drops[id]--; if (!S.drops[id]) delete S.drops[id]; } render(); };
$("clear").onclick = () => { S.drops = {}; S.history = []; render(); };
$("deliver").onclick = deliver;
$("skip").onclick = newOrder;
$("name").oninput = (e) => { S.name = e.target.value; drawProduct($("view"), { product: S.product, color: mix(S.drops), finish: S.finish, seed: S.history.length + 3, label: S.name }); };

function start(data) {
  load();
  if (data && data.order) { Object.assign(S, data); $("name").value = S.name || ""; render(); }
  else newOrder();
  window.claude?.hot?.snapshot?.(() => S);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
